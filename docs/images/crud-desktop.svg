  <g stroke="#e8edf3"><line x1="562" y1="332" x2="1473" y2="332"/><line x1="562" y1="405" x2="1473" y2="405"/><line x1="562" y1="478" x2="1473" y2="478"/><line x1="562" y1="551" x2="1473" y2="551"/><line x1="562" y1="624" x2="1473" y2="624"/></g>
