  <g><rect x="1400" y="350" width="38" height="38" rx="8" fill="#ffc107"/><text x="1410" y="375" fill="#252a31" font-family="Arial, sans-serif" font-size="18">✎</text><rect x="1444" y="350" width="29" height="38" rx="8" fill="#dc3545"/><text x="1452" y="375" fill="#fff" font-family="Arial, sans-serif" font-size="16">×</text><rect x="1400" y="423" width="38" height="38" rx="8" fill="#ffc107"/><text x="1410" y="448" fill="#252a31" font-family="Arial, sans-serif" font-size="18">✎</text><rect x="1444" y="423" width="29" height="38" rx="8" fill="#dc3545"/><text x="1452" y="448" fill="#fff" font-family="Arial, sans-serif" font-size="16">×</text><rect x="1400" y="496" width="38" height="38" rx="8" fill="#ffc107"/><text x="1410" y="521" fill="#252a31" font-family="Arial, sans-serif" font-size="18">✎</text><rect x="1444" y="496" width="29" height="38" rx="8" fill="#dc3545"/><text x="1452" y="521" fill="#fff" font-family="Arial, sans-serif" font-size="16">×</text></g>
