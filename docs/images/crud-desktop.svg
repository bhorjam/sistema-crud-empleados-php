<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="820" viewBox="0 0 1536 820" role="img" aria-labelledby="title desc">
  <title id="title">Vista de escritorio del CRUD de empleados</title>
  <desc id="desc">Interfaz de ejemplo con formulario de empleado y tabla con datos demostrativos.</desc>
  <rect width="1536" height="820" fill="#eef0f2"/>
  <text x="42" y="62" fill="#252a31" font-family="Arial, sans-serif" font-size="37" font-weight="700">Sistema CRUD de Empleados en PHP con PDO y MySQL</text>
  <text x="42" y="96" fill="#667085" font-family="Arial, sans-serif" font-size="17">Administra el registro de tu equipo de forma sencilla.</text>
  <rect x="34" y="128" width="1468" height="660" rx="14" fill="#fff" stroke="#e7ebef"/>
  <line x1="532" y1="129" x2="532" y2="788" stroke="#e8edf3"/>
  <text x="62" y="184" fill="#252a31" font-family="Arial, sans-serif" font-size="23" font-weight="700">Empleado</text>
  <rect x="465" y="151" width="40" height="40" rx="8" fill="#0abf62"/>
  <text x="477" y="179" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">+</text>
  <g fill="#303841" font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <text x="62" y="235">Nombre</text><text x="62" y="321">Tipo de documento</text><text x="62" y="407">Número de documento</text>
    <text x="62" y="493">Edad</text><text x="260" y="493">Sexo</text><text x="62" y="579">Teléfono</text><text x="62" y="665">Seleccione el cargo</text>
  </g>
  <g fill="#fff" stroke="#dfe5eb">
    <rect x="62" y="247" width="443" height="44" rx="7"/><rect x="62" y="333" width="443" height="44" rx="7"/>
    <rect x="62" y="419" width="443" height="44" rx="7"/><rect x="62" y="505" width="168" height="44" rx="7"/>
    <rect x="62" y="591" width="443" height="44" rx="7"/><rect x="62" y="677" width="443" height="44" rx="7"/>
  </g>
  <g fill="#667085" font-family="Arial, sans-serif" font-size="14">
