  <rect x="62" y="737" width="443" height="38" rx="7" fill="#303030"/><text x="185" y="762" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700">+ Agregar empleado</text>
  <text x="562" y="184" fill="#252a31" font-family="Arial, sans-serif" font-size="27" font-weight="700">Lista de empleados</text>
  <text x="562" y="212" fill="#667085" font-family="Arial, sans-serif" font-size="15">Total de empleados: 3</text>
