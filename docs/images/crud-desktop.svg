  <text x="652" y="259" fill="#303841" font-family="Arial, sans-serif" font-size="14">registros</text>
  <rect x="1245" y="235" width="228" height="38" rx="6" fill="#fff" stroke="#dfe5eb"/><text x="1262" y="259" fill="#98a2b3" font-family="Arial, sans-serif" font-size="14">⌕  Buscar empleado</text>
