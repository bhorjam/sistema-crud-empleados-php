<svg xmlns="http://www.w3.org/2000/svg" width="525" height="780" viewBox="0 0 525 780" role="img" aria-labelledby="title desc">
  <title id="title">Formulario del CRUD de empleados en vista móvil</title>
  <desc id="desc">Formulario adaptable con documento peruano DNI o CE, teléfono de nueve dígitos y datos ficticios.</desc>
  <rect width="525" height="780" rx="22" fill="#f3f5f7"/>
  <rect x="22" y="18" width="481" height="744" rx="16" fill="#fff" stroke="#e8edf3"/>
  <text x="48" y="66" fill="#252a31" font-family="Arial, sans-serif" font-size="24" font-weight="700">Empleado</text>
  <rect x="444" y="38" width="38" height="38" rx="8" fill="#0abf62"/><text x="456" y="65" fill="#fff" font-family="Arial, sans-serif" font-size="25" font-weight="700">+</text>
  <g fill="#303841" font-family="Arial, sans-serif" font-size="14" font-weight="700"><text x="48" y="122">Nombre</text><text x="48" y="220">Tipo de documento</text><text x="48" y="318">Número de documento</text><text x="48" y="416">Edad</text><text x="258" y="416">Sexo</text><text x="48" y="536">Teléfono</text><text x="48" y="634">Seleccione el cargo</text></g>
  <g fill="#fff" stroke="#dfe5eb"><rect x="48" y="136" width="429" height="48" rx="7"/><rect x="48" y="234" width="429" height="48" rx="7"/><rect x="48" y="332" width="429" height="48" rx="7"/><rect x="48" y="430" width="160" height="48" rx="7"/><rect x="48" y="550" width="429" height="48" rx="7"/><rect x="48" y="648" width="429" height="48" rx="7"/></g>
  <g fill="#667085" font-family="Arial, sans-serif" font-size="15"><text x="64" y="165">Nombre de ejemplo</text><text x="64" y="263">DNI  ▾</text><text x="64" y="361">8 dígitos</text><text x="64" y="459">Edad</text><text x="64" y="579">9 dígitos, ej. 987654321</text><text x="64" y="677">Cargo</text></g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#303841"><circle cx="266" cy="454" r="9" fill="#0abf62"/><text x="284" y="459">Masculino</text><circle cx="386" cy="454" r="9" fill="#fff" stroke="#cfd6df"/><text x="404" y="459">Femenino</text></g>
  <rect x="48" y="716" width="429" height="38" rx="7" fill="#303030"/><text x="171" y="741" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700">+ Agregar empleado</text>
</svg>
